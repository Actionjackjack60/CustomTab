<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CustomTab</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0d0d0f;
    --text: white;
    --box: #111;
    --border: white;
    --topbar: #1e3a8a;
    --toptext: white;
}
.light {
    --bg: #f5f5f5;
    --text: #111;
    --box: #fff;
    --border: #111;
    --topbar: #3b82f6;
    --toptext: #111;
}
* {margin:0; padding:0; box-sizing:border-box; font-family:'Lato', sans-serif;}
body { background: var(--bg); color: var(--text); height:100vh; display:flex; flex-direction:column; transition: background 0.3s,color 0.3s;}
.top-bar { width:100%; padding:18px 22px; background: var(--topbar); display:flex; justify-content:space-between; font-size:17px; font-weight:600; color: var(--toptext); transition: background 0.3s,color 0.3s; }
.container { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:15px; }
h1 { font-size:48px; }
.weather { font-size:16px; opacity:0.9; margin-bottom:5px; cursor:pointer; text-align:center; white-space:pre-line; }
.weather button { padding:6px 14px; border-radius:999px; border:2px solid var(--border); background: var(--box); color: var(--text); cursor:pointer; transition:background 0.3s,color 0.3s; }
.search-container { position:relative; width:400px; max-width:90%; }
input { width:100%; padding:14px 45px 14px 20px; border-radius:999px; border:2px solid var(--border); background: var(--box); color: var(--text); font-size:16px; outline:none; transition:background 0.3s,color 0.3s,box-shadow 0.25s; }
input:focus { box-shadow:0 0 12px rgba(255,255,255,0.3); }
.light input:focus { box-shadow:0 0 12px rgba(0,0,0,0.2); }
.search-icon { position:absolute; right:15px; top:50%; transform:translateY(-50%); pointer-events:none; }
.buttons { display:flex; gap:15px; margin-top:10px; }
button { padding:10px 20px; border-radius:999px; border:2px solid var(--border); background: var(--box); color: var(--text); cursor:pointer; transition: background 0.3s,color 0.3s,opacity 0.25s; }
button:hover { opacity:0.85; }
.toggle { position:fixed; bottom:15px; right:15px; cursor:pointer; width:28px; height:28px; }
.toggle img { width:28px; height:28px; transition:filter 0.3s; }
body:not(.light) .toggle img { filter:invert(1); }
.quote { font-size:14px; opacity:0.8; margin-top:5px; text-align:center; max-width:400px; }
.favorites { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:10px; max-width:90%; }
.favorite-btn { padding:6px 14px; border-radius:999px; border:2px solid var(--border); background: var(--box); color: var(--text); cursor:pointer; position:relative; transition: background 0.3s,color 0.3s; }
.favorite-btn:hover { opacity:0.85; }
.remove-btn { position:absolute; top:-6px; right:-6px; background:red; color:white; border:none; border-radius:50%; width:18px; height:18px; font-size:12px; cursor:pointer; line-height:16px; padding:0; }
.menu { position:absolute; background:var(--box); border:2px solid var(--border); border-radius:10px; padding:10px; display:none; flex-direction:column; gap:8px; z-index:10; }
.menu input { width:220px; padding:6px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
.menu button { width:100%; }
</style>
</head>
<body>
<div class="top-bar">
    <div id="date"></div>
    <div id="time"></div>
</div>

<div class="container">
    <h1>CustomTab</h1>

    <div class="weather" id="weather">
        <button id="enableWeatherBtn">Enable Weather</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Ask anything...">
        <span class="search-icon">🔍</span>
    </div>

    <div class="buttons">
        <button onclick="searchGoogle()">Search</button>
        <button onclick="askAI()">Ask AI</button>
        <button id="addFavBtn">Add Favorite</button>
    </div>

    <div class="favorites" id="favorites"></div>

    <div class="quote" id="quote"></div>
</div>

<div class="toggle" onclick="toggleTheme()">
    <img src="lightdark.png" alt="Toggle Theme">
</div>

<!-- Mini menu for adding favorites -->
<div class="menu" id="favMenu">
    <input type="text" id="favName" placeholder="Name">
    <input type="text" id="favURL" placeholder="URL (https://...)">
    <button id="saveFav">Save Favorite</button>
</div>

<script>
// --- Time ---
function updateTime(){
    const now=new Date();
    document.getElementById('date').textContent=now.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'2-digit'});
    document.getElementById('time').textContent=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateTime,1000);
updateTime();

// --- Theme ---
function toggleTheme(){
    document.body.classList.toggle("light");
    localStorage.setItem("theme",document.body.classList.contains("light")?"light":"dark");
}
if(localStorage.getItem("theme")==="light"){ document.body.classList.add("light"); }

// --- Search ---
function formatQuery(q){ return q.trim().replace(/\s+/g,"+"); }
function searchGoogle(){ const q=document.getElementById("searchInput").value; if(!q)return; window.open("https://www.google.com/search?q="+formatQuery(q),"_blank"); }
function askAI(){ const q=document.getElementById("searchInput").value; if(!q)return; window.open("https://chatgpt.com/?q="+formatQuery(q),"_blank"); }
document.getElementById("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")searchGoogle();});

// --- Quotes ---
const quotes=["Believe you can and you're halfway there.","Do something today that your future self will thank you for.","Happiness is not by chance, but by choice.","The best way to get started is to quit talking and begin doing.","Success is not final, failure is not fatal: It is the courage to continue that counts."];
document.getElementById("quote").textContent=quotes[Math.floor(Math.random()*quotes.length)];

// --- Weather ---
const weatherBtn = document.getElementById("enableWeatherBtn");
const weatherDiv = document.getElementById("weather");
let lastWeatherData = null;
if(localStorage.getItem("weatherEnabled")==="true") loadWeather();
async function loadWeather() {
    localStorage.setItem("weatherEnabled","true");
    weatherBtn.disabled = true;
    weatherBtn.textContent = "Loading...";
    let latitude = 40.7128, longitude = -74.0060;
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(pos=>{
            latitude=pos.coords.latitude; longitude=pos.coords.longitude;
            fetchWeather(latitude,longitude);
        }, ()=>fetchWeather(latitude,longitude), {timeout:5000});
    } else fetchWeather(latitude,longitude);
    weatherBtn.style.display = "none";
}
async function fetchWeather(lat, lon){
    try {
        const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode&temperature_unit=fahrenheit&timezone=auto`;
        const res=await fetch(url); const data=await res.json();
        const temp=Math.round(data.current.temperature_2m); const code=data.current.weathercode;
        const map={0:"☀️ Clear",1:"🌤️ Mostly Clear",2:"⛅ Partly Cloudy",3:"☁️ Cloudy",45:"🌫️ Fog",51:"🌦️ Drizzle",61:"🌧️ Rain",71:"❄️ Snow",80:"🌦️ Showers",95:"⛈️ Storm"};
        lastWeatherData={temp,text:map[code]||"❓ Unknown"};
        weatherDiv.textContent=`${map[code]||"❓ Unknown"} • ${temp}°F`;
    } catch{ weatherDiv.textContent="Weather fetch failed"; }
}
weatherBtn.addEventListener("click", loadWeather);
setInterval(()=>{ if(!weatherBtn.style.display || weatherBtn.style.display==="none") loadWeather(); },300000);

// --- Favorites ---
const favDiv=document.getElementById("favorites");
let favorites=JSON.parse(localStorage.getItem("favorites")||"[]");

function renderFavorites(){
    favDiv.innerHTML="";
    favorites.forEach((f,index)=>{
        const btn=document.createElement("div");
        btn.className="favorite-btn";
        btn.textContent=f.name;
        btn.onclick=()=>window.open(f.url,"_blank");

        const removeBtn=document.createElement("button");
        removeBtn.className="remove-btn";
        removeBtn.textContent="×";
        removeBtn.onclick=(e)=>{
            e.stopPropagation();
            favorites.splice(index,1);
            localStorage.setItem("favorites",JSON.stringify(favorites));
            renderFavorites();
        };

        btn.appendChild(removeBtn);
        favDiv.appendChild(btn);
    });
}
renderFavorites();

// --- Favorite menu ---
const favMenu=document.getElementById("favMenu");
const addFavBtn=document.getElementById("addFavBtn");
const saveFavBtn=document.getElementById("saveFav");
addFavBtn.addEventListener("click",()=>{
    favMenu.style.display="flex";
    favMenu.style.top=(addFavBtn.getBoundingClientRect().bottom+5)+"px";
    favMenu.style.left=(addFavBtn.getBoundingClientRect().left)+"px";
});
saveFavBtn.addEventListener("click",()=>{
    const name=document.getElementById("favName").value.trim();
    let url=document.getElementById("favURL").value.trim();
    if(!name || !url) return;
    if(!/^https?:\/\//i.test(url)) url="https://"+url;
    favorites.push({name,url});
    localStorage.setItem("favorites",JSON.stringify(favorites));
    renderFavorites();
    favMenu.style.display="none";
    document.getElementById("favName").value="";
    document.getElementById("favURL").value="";
});
document.addEventListener("click",(e)=>{
    if(!favMenu.contains(e.target) && e.target!==addFavBtn){
        favMenu.style.display="none";
    }
});
</script>
</body>
</html>
