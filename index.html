<div class="weather" id="weather">
  <button id="enableWeatherBtn">Enable Weather</button>
</div>

<script>
const weatherBtn = document.getElementById("enableWeatherBtn");
const weatherDiv = document.getElementById("weather");
let lastWeatherData = null;

async function loadWeather() {
    weatherBtn.disabled = true;
    weatherBtn.textContent = "Loading...";

    // Fallback coordinates (New York)
    let latitude = 40.7128;
    let longitude = -74.0060;

    // Try geolocation, silently fallback if fails
    if(navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            pos => {
                latitude = pos.coords.latitude;
                longitude = pos.coords.longitude;
                fetchWeather(latitude, longitude);
            },
            err => {
                console.log("Geolocation failed or blocked, using fallback.");
                fetchWeather(latitude, longitude);
            },
            {timeout:5000}
        );
    } else {
        fetchWeather(latitude, longitude);
    }

    weatherBtn.style.display = "none";
}

async function fetchWeather(lat, lon) {
    try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode&temperature_unit=fahrenheit&timezone=auto`;
        const res = await fetch(url);
        const data = await res.json();

        const temp = Math.round(data.current.temperature_2m);
        const code = data.current.weathercode;

        const map = {
            0:"☀️ Clear",
            1:"🌤️ Mostly Clear",
            2:"⛅ Partly Cloudy",
            3:"☁️ Cloudy",
            45:"🌫️ Fog",
            51:"🌦️ Drizzle",
            61:"🌧️ Rain",
            71:"❄️ Snow",
            80:"🌦️ Showers",
            95:"⛈️ Storm"
        };

        weatherDiv.textContent = `${map[code]||"❓ Unknown"} • ${temp}°F • Lat:${lat.toFixed(1)}, Lon:${lon.toFixed(1)}`;
    } catch {
        weatherDiv.textContent = "Weather fetch failed";
    }
}

weatherBtn.addEventListener("click", loadWeather);

// Optional: refresh every 5 minutes
setInterval(() => {
    if(lastWeatherData || !weatherBtn.style.display || weatherBtn.style.display === "none") loadWeather();
}, 300000);
</script>
